[package]
name = "convt-app"
description = "convt desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "convt-app"
path = "src/main.rs"

[dependencies]
base64.workspace = true
convt-core.workspace = true
convt-engines.workspace = true
convt-license = { workspace = true, features = ["client"] }
convt-update.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
gpui-kit.workspace = true
# Decodes the tray icons; already built for the engines.
image.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon, as a StatusNotifierItem over D-Bus. tray-icon would need GTK
# here, which GPUI doesn't run; ksni needs neither and reports a desktop with
# no tray, so the app can quit with its last window there.
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# The menu bar item on macOS and the notification area icon on Windows.
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through GPUI; used for the Services menu provider.
objc = "0.2.7"

[lints.rust]
# objc 0.2's `msg_send!` expands to a `feature = "cargo-clippy"` check.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
ed25519-dalek.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
