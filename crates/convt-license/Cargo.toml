[package]
name = "convt-license"
description = "Offline license keys for convt desktop builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The `client` feature: trial, key storage and the check before converting,
# plus desktop sign-in, the trial and key renewal (`account`).
dirs = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
machine-uid = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"], optional = true }

[features]
client = [
  "dep:dirs",
  "dep:getrandom",
  "dep:hmac",
  "dep:keyring",
  "dep:machine-uid",
  "dep:sha2",
  "dep:tracing",
  "dep:ureq",
]

[dev-dependencies]
getrandom.workspace = true
tempfile.workspace = true

[[example]]
name = "dev-keys"
