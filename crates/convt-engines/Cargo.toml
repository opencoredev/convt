[package]
name = "convt-engines"
description = "Conversion engines for convt: FFmpeg, images, SVG, PDFium, LibreOffice, Markdown, data and subtitles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["pdfium"]
pdfium = ["dep:pdfium-render"]

[dependencies]
convt-core.workspace = true
dirs.workspace = true
image.workspace = true
png = "=0.18.1"
gif = "=0.14.2"
libwebp-sys = "=0.14.4"
libloading.workspace = true
pdfium-render = { workspace = true, optional = true }
resvg.workspace = true
tempfile.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2 = "=0.10.9"
flate2 = "=1.1.10"
tar = "=0.4.45"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
which.workspace = true
url = "=2.5.8"
base64.workspace = true
csv = "=1.4.0"
htmd = "=0.5.6"
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# serde_yaml is deprecated; serde_norway is its maintained fork.
serde_norway = "=0.9.42"
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
