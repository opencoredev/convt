overlay: 1.1.0
info:
  title: convt public docs
  version: 1.0.0
# The server's spec (crates/convt-server/openapi.json) stays the source of truth for
# paths and schemas. This overlay adds the prose, tags and examples. The live host
# comes from api-host.ts via the generated servers overlay. It applies on every
# build, so spec changes flow through.
actions:
  - target: $.info
    update:
      title: convt API
      description: |
        The convt API converts files on convt's servers. `POST /v1/convert` takes a file of up to 25 MB, or a `source_url`, and answers with the converted file in one request. For files up to 2 GB, a conversion is a **job**: you reserve it, upload the file to a signed URL, start it, poll until it finishes (or get a webhook), then fetch signed download URLs for its outputs.

        Send an `Idempotency-Key` on creates so retries never reserve twice. Every response carries `X-Request-Id` and, on job routes, `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`.

        Every job route takes a `cvt_live_` API key as a Bearer token. Create keys in the [dashboard](https://convt.app/dashboard/api). Each successful job is billed once; failed and cancelled jobs are free.

  - target: $
    update:
      tags:
        - name: Convert
          description: One request in, the converted file out. Every route needs a `cvt_live_` key.
        - name: Jobs
          description: Reserve, upload, start, poll, cancel and download a conversion. Every route needs a `cvt_live_` key.
        - name: Webhooks
          description: The secret that signs job webhooks.
        - name: Formats
          description: The formats convt knows. Public, no key needed.

  # Reserve
  - target: $.paths['/v1/jobs'].post
    update:
      tags: [Jobs]
      summary: Create a job
      description: |
        Reserves one conversion and returns a signed `upload_url`, valid for `upload_expires_in` seconds: 900 for a new job, less (or no URL) for an idempotent replay close to the job's 24-hour expiry.

        `input_bytes` must be the exact size of the file you will upload, from 1 byte to 2 GB. The upload signature binds `Content-Length`, so a different size fails at upload or at start.

        Creating a job reserves 1 cent against your spend cap until the job finishes. A job that fails or is cancelled releases the reservation.
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json']
    update:
      example:
        input_format: png
        target_format: webp
        input_bytes: 48213
        options:
          quality: 80
          max_size: 2048
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.input_format
    update:
      description: Format id of the file you upload, such as `png` or `docx`. See [Formats](https://convt.app/docs/reference/formats).
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.target_format
    update:
      description: Format id to convert to. It must differ from `input_format` and be a target the input can reach.
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.input_bytes
    update:
      description: Exact size of the upload in bytes.
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.options
    update:
      description: Optional conversion settings. Leave it out to use the defaults. Settings that don't apply to the target format are ignored.
  - target: $.paths['/v1/jobs'].post.responses['200']
    update:
      description: The job was reserved. Upload the file to `upload_url` next.
      content:
        application/json:
          example:
            job:
              id: job_01k6z7v4q8m3x2a9b5c0d1e2f3
              status: created
              input_format: png
              target_format: webp
              options:
                quality: 80
                max_size: 2048
              input_bytes: 48213
              attempt: 0
              error_code: null
              expires_at: "2026-10-08T12:00:00Z"
            upload_url: https://bucket.example/job_01k6z7v4q8m3x2a9b5c0d1e2f3/upload?X-Amz-Signature=…
            upload_expires_in: 900
  - target: $.paths['/v1/jobs'].post.responses['200'].content['application/json'].schema.properties.upload_url
    update:
      description: Signed URL. Send the file bytes to it with `PUT`. `null` for a `source_url` job, and for an idempotent replay of a job that was already started.
  - target: $.paths['/v1/jobs'].post.responses['200'].content['application/json'].schema.properties.upload_expires_in
    update:
      description: Seconds until `upload_url` stops accepting uploads, 900, or `null` when there is no `upload_url`.
  - target: $.paths['/v1/jobs'].post.responses['400']
    update:
      description: "`invalid_request` (the body is not JSON or misses a required field), `unsupported_format`, `invalid_options` or `file_too_large`."
      content:
        application/json:
          example:
            error:
              code: unsupported_format
              message: This input cannot reach the chosen target format.
  - target: $.paths['/v1/jobs'].post.responses['403']
    update:
      description: "`unauthorized` (bad or revoked key), `not_enrolled`, `limit_reached` or `storage_limit_reached`."
      content:
        application/json:
          example:
            error:
              code: limit_reached
              message: Your allowance or spend cap has been reached.

  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.source_url
    update:
      description: A public https URL convt downloads instead of an upload, up to 2 GB. Leave out `input_bytes`; the job is queued at once and needs no start. See [Remote files](https://convt.app/docs/guides/remote-files).
  - target: $.paths['/v1/jobs'].post.requestBody.content['application/json'].schema.properties.webhook_url
    update:
      description: A public https URL that gets one signed POST when the job finishes. See [Webhooks](https://convt.app/docs/guides/webhooks).
  - target: $.paths['/v1/jobs'].post.responses['409']
    update:
      description: "`idempotency_key_reused`: the `Idempotency-Key` was used for a different request in the last 24 hours."

  # Convert
  - target: $.paths['/v1/convert'].post
    update:
      tags: [Convert]
      description: |
        Converts a file in one request: reserve, upload, queue, wait and return the result, on the same pipeline, spend cap and billing as the jobs routes.

        Send the file as a multipart `file` field (with `to`, and optionally `from` and `options`), as the raw body with `to` in the query, or send JSON with `source_url`. `to` and `from` take format ids or extensions; `from` is inferred from the file name, URL or `Content-Type` when left out.

        When the job succeeds with one output and `Accept` does not ask for JSON, the response is the file, named after yours in `Content-Disposition`. With several outputs (a multi-page PDF to PNG) or `Accept: application/json`, it is JSON with signed URLs. When the job is still running after `wait` seconds, a request with `Accept: application/json` gets `202` and the job keeps running; a file request gets `409 still_running` if it sent an `Idempotency-Key` (the job keeps running) or `504 timeout` if not (the job is cancelled).

        Without an `Idempotency-Key`, hanging up before the answer cancels the job; that is best effort, and a job that already succeeded is billed. With one, the job keeps running and a retry with the same key collects it.
  - target: $.paths['/v1/convert'].post.responses['400']
    update:
      description: "`invalid_request`, `input_format_required`, `unsupported_format`, `invalid_options`, `invalid_source_url`, `invalid_idempotency_key` or an empty file (`file_too_large`)."
  - target: $.paths['/v1/convert'].post.responses['409']
    update:
      description: "`cancelled` (the job was cancelled first), `still_running` (a file request with an `Idempotency-Key` that isn't done after `wait`; retry with the key) or `idempotency_key_reused`."
  - target: $.paths['/v1/convert'].post.responses['413']
    update:
      description: "`file_too_large`: over 25 MB. Use `POST /v1/jobs` or `source_url`."
  - target: $.paths['/v1/convert'].post.responses['503']
    update:
      description: "`server_busy`: too many uploads in progress. Retry after `Retry-After` seconds."
  - target: $.paths['/v1/convert'].post.responses['504']
    update:
      description: "`timeout`: a file request without an `Idempotency-Key` did not finish within `wait`. The job was cancelled; not charged."
  - target: $.paths['/v1/convert'].post.responses['422']
    update:
      description: "The conversion failed. `code` is the job's `error_code`, such as `conversion_failed` or `source_fetch_failed`. Not charged."

  # Webhooks
  - target: $.paths['/v1/webhooks/secret/rotate'].post
    update:
      tags: [Webhooks]
      description: Replaces the account's webhook signing secret and returns the new one. Deliveries from then on are signed with it. API keys only.
  - target: $.paths['/v1/webhooks/secret'].get
    update:
      tags: [Webhooks]
      description: |
        Returns the secret that signs your account's webhook deliveries in the `Convt-Signature` header, and its version. API keys only. Fetch it once and store it with your other secrets. See [Webhooks](https://convt.app/docs/guides/webhooks).

  # Read
  - target: $.paths['/v1/jobs/{id}'].get
    update:
      tags: [Jobs]
      summary: Get a job
      description: |
        Returns the job's current status. Poll this about once a second after you start the job, and stop when `status` is `succeeded`, `failed` or `cancelled`.

        Jobs disappear 24 hours after they were created. After that this returns `404 not_found`, whatever state the job was in.
  - target: $.paths['/v1/jobs/{id}'].get.responses['200']
    update:
      description: The job.
      content:
        application/json:
          example:
            id: job_01k6z7v4q8m3x2a9b5c0d1e2f3
            status: running
            input_format: png
            target_format: webp
            input_bytes: 48213
            attempt: 1
            error_code: null
            expires_at: "2026-10-08T12:00:00Z"

  # Start
  - target: $.paths['/v1/jobs/{id}/start'].post
    update:
      tags: [Jobs]
      summary: Start a job
      description: |
        Seals the uploaded file, checks that its size matches `input_bytes`, and queues the job. The response usually shows `queued`.

        Calling start again is safe: a job that is no longer `created` is returned as it is. If the uploaded size does not match, the job is cancelled and the call fails with `size_mismatch`. Reserve a new job to try again.

        If nothing was uploaded, start fails with `409 upload_missing` and the job stays `created`. Upload, then call start again.
  - target: $.paths['/v1/jobs/{id}/start'].post.responses['200']
    update:
      description: The job, now `queued`, or unchanged if it was already started.
      content:
        application/json:
          example:
            id: job_01k6z7v4q8m3x2a9b5c0d1e2f3
            status: queued
            input_format: png
            target_format: webp
            input_bytes: 48213
            attempt: 0
            error_code: null
            expires_at: "2026-10-08T12:00:00Z"
  - target: $.paths['/v1/jobs/{id}/start'].post.responses['400']
    update:
      description: "`size_mismatch`: the upload's size differs from `input_bytes`. The job is cancelled."
      content:
        application/json:
          example:
            error:
              code: size_mismatch
              message: Uploaded size must match the reservation and stay within 2 GB.

  # Cancel
  - target: $.paths['/v1/jobs/{id}/cancel'].post
    update:
      tags: [Jobs]
      summary: Cancel a job
      operationId: cancelJob
      description: |
        Cancels a job that has not finished and releases its 1-cent reservation. Cancelling a finished job changes nothing and returns it as it is, so check `status` in the response: `succeeded` means the job finished first and was billed.

        The uploaded file still counts toward your storage limit until the job expires 24 hours after creation.
  - target: $.paths['/v1/jobs/{id}/cancel'].post.responses['200']
    update:
      description: The job after cancellation.

  # Download
  - target: $.paths['/v1/jobs/{id}/download'].get
    update:
      tags: [Jobs]
      summary: Get download URLs
      description: |
        Returns a signed URL for every output of a `succeeded` job. Most conversions have one output; some, such as a multi-page PDF to PNG, have several.

        Output names are based on `input`, not on your file's name: `input.webp`, or `input.png`, `input-2.png` and so on for pages. Rename them when you save them.

        The URLs expire after `expires_in` seconds, at most 5 minutes. Call this route again for fresh URLs while the job exists. Calling it before the job succeeds fails with `not_ready`.
  - target: $.paths['/v1/jobs/{id}/download'].get.responses['200']
    update:
      description: Signed URLs for each output.
      content:
        application/json:
          example:
            outputs:
              - name: input.webp
                url: https://bucket.example/job_01k6z7v4q8m3x2a9b5c0d1e2f3/attempt-1/input.webp?X-Amz-Signature=…
            expires_in: 300
  - target: $.paths['/v1/jobs/{id}/download'].get.responses['400']
    update:
      description: "`not_ready`: the job has not succeeded."
      content:
        application/json:
          example:
            error:
              code: not_ready
              message: Job has no completed outputs.

  # Formats
  - target: $.paths['/v1/formats'].get
    update:
      tags: [Formats]
      operationId: listFormats
      summary: List formats
      description: |
        Lists every format convt recognizes, with its id, extensions and MIME type. Use the `id` values for `input_format` and `target_format`.

        Not every pair converts in the cloud. The [Formats](https://convt.app/docs/reference/formats) page lists the targets each input can reach through the API.
      security: []
  - target: $.paths['/v1/formats'].get.responses['200']
    update:
      description: All known formats.
      content:
        application/json:
          example:
            - id: png
              name: PNG
              category: image
              extensions: [png]
              mime: image/png
            - id: webp
              name: WebP
              category: image
              extensions: [webp]
              mime: image/webp

  # Shared
  - target: $.paths.*.*.parameters[?@.name == 'id']
    update:
      description: The job id returned when you created the job, such as `job_01k6z7v4q8m3x2a9b5c0d1e2f3`.
      example: job_01k6z7v4q8m3x2a9b5c0d1e2f3
  - target: $.paths.*.*.responses['401']
    update:
      description: "`unauthorized`: no `Authorization: Bearer` header."
  - target: $.paths.*.*.responses['403']
    update:
      description: "`unauthorized` (key invalid or revoked) or a billing limit."
  - target: $.paths.*.*.responses['404']
    update:
      description: "`not_found`: the job does not exist, belongs to another account, or has expired."
  - target: $.paths.*.*.responses['429']
    update:
      description: "`rate_limited`: more than 120 requests in a minute for this key."
  - target: $.paths.*.*.responses['502']
    update:
      description: "`storage_unavailable`: object storage did not answer. Retry with backoff."
  - target: $.components.securitySchemes.bearerAuth
    update:
      description: "A `cvt_live_` API key from the [dashboard](https://convt.app/dashboard/api), sent as `Authorization: Bearer cvt_live_…`. Keep it on your server."
  - target: $.components.schemas.Job
    update:
      description: One conversion and its state.
  - target: $.components.schemas.Job.properties.id
    update: { description: "Job id, prefixed `job_`." }
  - target: $.components.schemas.Job.properties.status
    update:
      description: "`created` → `queued` → `running` → `succeeded` or `failed`. `cancelled` can happen at any point before the job finishes. `uploaded` is reserved and not used yet."
  - target: $.components.schemas.Job.properties.attempt
    update: { description: How many times a worker has picked up the job. Starts at 0. }
  - target: $.components.schemas.Job.properties.error_code
    update:
      description: Why a `failed` job failed (`conversion_failed`, `source_fetch_failed`, `expired_or_exhausted` or `expired`), otherwise `null`.
  - target: $.components.schemas.Job.properties.input_bytes
    update: { description: Size you reserved, in bytes. }
  - target: $.components.schemas.Job.properties.expires_at
    update: { description: When the job and its files are deleted, 24 hours after creation. }
  - target: $.components.schemas.Job.properties.options
    update:
      description: "The settings the job converts with, as sent when it was created."
  - target: $.components.schemas.Options
    update:
      description: "Conversion settings. Every field is optional, and an unknown field, a value of the wrong type or an out-of-range value fails with `400 invalid_options` when you create the job."
  - target: $.components.schemas.Options.properties.quality
    update:
      description: "Lossy quality from 1 to 100 for JPEG, AVIF, HEIC and video output. WebP output is lossless and ignores it."
  - target: $.components.schemas.Options.properties.max_size
    update:
      description: "Longest edge of image output in pixels. Larger images are scaled down; smaller ones are left alone."
  - target: $.components.schemas.Options.properties.video_height
    update:
      description: "Maximum video height in pixels, an even number. Scales down only and keeps the aspect ratio."
  - target: $.components.schemas.Options.properties.audio_bitrate
    update:
      description: "Audio bitrate in kbit/s, from 8 to 640."
  - target: $.components.schemas.Options.properties.pages
    update:
      description: "PDF pages to render: `2`, `1-3` or `4-` (page 4 to the end)."
  - target: $.components.schemas.Options.properties.dpi
    update:
      description: "Resolution for rendering PDF and SVG pages, from 18 to 1200."
  - target: $.components.schemas.Options.properties.video_codec
    update:
      description: "Encoder for MP4, MOV and MKV output: `h264` (the default) or `hevc`."
  - target: $.components.schemas.Options.properties.background
    update:
      description: "What transparent areas become: `transparent`, `white`, `black` or a color like `#ff8800`. Unset keeps transparency where the format can store it and uses white where it can't. `transparent` fails for formats without transparency, such as JPEG."
  - target: $.components.schemas.Options.properties.strip_audio
    update:
      description: "Leave the audio out of video output."
  - target: $.components.schemas.Error
    update:
      description: Every JSON error has this shape. `code` is stable; `message` is for people and may change.
