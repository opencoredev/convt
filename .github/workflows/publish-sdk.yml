name: Publish SDK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-sdk
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # npm trusted publishing only accepts GitHub-hosted runners.
    runs-on: ubuntu-24.04
    # The environment only deploys from main, and npm trusts only this environment.
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Skip a version npm already has
        id: version
        working-directory: packages/sdk
        run: |
          version=$(node -p 'require("./package.json").version')
          if versions=$(npm view @convt/sdk versions --json 2> "$RUNNER_TEMP/npm-view.err"); then
            published=$(node -e 'const v = JSON.parse(process.argv[1]); console.log((Array.isArray(v) ? v : [v]).includes(process.argv[2]))' "$versions" "$version")
          elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            published=false
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi
          if [ "$published" = true ]; then
            echo "@convt/sdk@$version is already on npm."
            echo publish=false >> "$GITHUB_OUTPUT"
          else
            echo publish=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/sdk
        run: bun test && bun run check-types
      - name: Publish with provenance
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/sdk
        run: npm publish --provenance --access public
