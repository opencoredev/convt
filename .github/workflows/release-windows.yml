name: Build release windows
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_date_epoch:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Synced release version (must match this commit)
        required: true
        type: string
      source_date_epoch:
        description: Release UTC Unix timestamp
        required: true
        type: string
      dry_run:
        description: Build without production license enforcement
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      CONVT_LICENSE_PUBKEY: ${{ vars.CONVT_LICENSE_PUBKEY }}
      CONVT_UPDATE_PUBKEY: ${{ vars.CONVT_UPDATE_PUBKEY }}
      CONVT_LICENSE_STORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check requested version and trusted branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = false ]; then test "$GITHUB_REF" = refs/heads/main; fi
          if [ "$DRY_RUN" = false ]; then
            test "$CONVT_LICENSE_PUBKEY" = FifI4kZfp25-La18pwNa4CJ751s4hDP68D60bp9rQoY
          fi
          test "$(python3 scripts/release/sync-version.py --check)" = "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the unsigned Windows payload (verification gates)
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # inputs.lock.json keeps distribution_ready=false until FFmpeg/PDFium
          # corresponding-source is collected. Public Release still needs an MSI
          # for /download; build with -VerificationOnly and label it unsigned.
          if ($env:DRY_RUN -eq 'false') { $env:CONVT_LICENSE_ENFORCE = '1' }
          ./packaging/windows/build.ps1 -VerificationOnly
      - name: Package unsigned per-user MSI
        shell: pwsh
        run: ./packaging/windows/installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-review
          path: packaging/out/windows/*.msi
          if-no-files-found: error
