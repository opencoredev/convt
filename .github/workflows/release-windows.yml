name: Release Windows (manual, Azure Trusted Signing)
on:
  workflow_dispatch:
    inputs:
      source_date_epoch:
        description: Release UTC Unix timestamp
        required: true
        type: string
      dry_run:
        description: Skip Azure signing
        default: true
        type: boolean
permissions:
  contents: read
  id-token: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      CONVT_LICENSE_PUBKEY: ${{ vars.CONVT_LICENSE_PUBKEY }}
      CONVT_UPDATE_PUBKEY: ${{ vars.CONVT_UPDATE_PUBKEY }}
      CONVT_LICENSE_STORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the audited Windows payload and installer
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -eq 'false') { $env:CONVT_LICENSE_ENFORCE = '1' }
          ./packaging/windows/build.ps1 -VerificationOnly:($env:DRY_RUN -eq 'true')
      - name: Azure workload identity login
        if: ${{ !inputs.dry_run }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign embedded executables and libraries
        if: ${{ !inputs.dry_run }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: packaging/out/windows/payload
          files-folder-filter: exe,dll
          files-folder-recurse: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
      - name: Package signed payload
        shell: pwsh
        run: ./packaging/windows/installer.ps1
      - name: Sign the installer
        if: ${{ !inputs.dry_run }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: packaging/out/windows
          files-folder-filter: msi,exe
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-review
          path: packaging/out/windows/
