name: Build release windows
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_date_epoch:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Synced release version (must match this commit)
        required: true
        type: string
      source_date_epoch:
        description: Release UTC Unix timestamp
        required: true
        type: string
      dry_run:
        description: Build without production license enforcement
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  ffmpeg:
    # Cross-build FFmpeg from the pinned sources in the pinned Ubuntu image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v5
      # Keyed on the lock and recipe: a hit is the output of the same pinned
      # sources, image and toolchain. Caches never cross from branches to main.
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-build
          key: windows-ffmpeg-${{ hashFiles('packaging/windows/ffmpeg-source.lock.json', 'packaging/windows/build-ffmpeg.sh', 'packaging/windows/build-ffmpeg-inside.sh') }}
      - name: Build FFmpeg from pinned sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: CONVT_BUILD_JOBS=4 bash packaging/windows/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-cache" "$RUNNER_TEMP/ffmpeg-build"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ffmpeg-build
          path: ${{ runner.temp }}/ffmpeg-build
          if-no-files-found: error
  windows:
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      CONVT_LICENSE_PUBKEY: ${{ vars.CONVT_LICENSE_PUBKEY }}
      CONVT_UPDATE_PUBKEY: ${{ vars.CONVT_UPDATE_PUBKEY }}
      CONVT_LICENSE_STORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check requested version and trusted branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = false ]; then test "$GITHUB_REF" = refs/heads/main; fi
          if [ "$DRY_RUN" = false ]; then
            test "$CONVT_LICENSE_PUBKEY" = FifI4kZfp25-La18pwNa4CJ751s4hDP68D60bp9rQoY
          fi
          test "$(python3 scripts/release/sync-version.py --check)" = "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg-build
          path: packaging/cache/windows/ffmpeg-build
      - name: Build the audited Windows payload and installer
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -eq 'false') { $env:CONVT_LICENSE_ENFORCE = '1' }
          ./packaging/windows/build.ps1 -VerificationOnly:($env:DRY_RUN -eq 'true')
      - name: Package unsigned per-user MSI
        shell: pwsh
        run: ./packaging/windows/installer.ps1
      - name: Check the installed FFmpeg and real conversions
        shell: pwsh
        run: |
          $Msi = (Get-ChildItem packaging/out/windows/*.msi).FullName
          $Root = Join-Path $env:RUNNER_TEMP 'msi-check'
          Start-Process msiexec -Wait -ArgumentList '/a', "`"$Msi`"", '/qn', "TARGETDIR=$Root"
          $Dir = (Get-ChildItem $Root -Recurse -Filter convt.exe | Select-Object -First 1).DirectoryName
          $Receipt = Get-Content packaging/cache/windows/ffmpeg-build/receipt.json -Raw | ConvertFrom-Json
          foreach ($Tool in 'ffmpeg.exe','ffprobe.exe') {
            $Hash = (Get-FileHash "$Dir/$Tool" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne $Receipt.binaries.$Tool) { throw "MSI $Tool differs from the source-built receipt" }
            "$Tool $Hash matches the source-built receipt"
          }
          & "$Dir/ffmpeg.exe" -hide_banner -buildconf
          if (!(Test-Path "$Dir/licenses/SOURCES.txt")) { throw 'SOURCES.txt missing' }
          $Work = Join-Path $env:RUNNER_TEMP 'convert-check'
          New-Item -ItemType Directory $Work | Out-Null
          & "$Dir/ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i testsrc=duration=1:size=320x240:rate=25 -f lavfi -i sine=duration=1 -c:v mpeg4 -c:a pcm_s16le -shortest "$Work/clip.avi"
          & "$Dir/ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i sine=duration=1 "$Work/tone.wav"
          foreach ($Case in @(@('clip.avi','mp4'), @('clip.avi','webm'), @('tone.wav','mp3'), @('tone.wav','ogg'))) {
            & "$Dir/convt.exe" "$Work/$($Case[0])" --to $Case[1] -o "$Work/out-$($Case[1])"
            if ($LASTEXITCODE -ne 0) { throw "convt $($Case[0]) to $($Case[1]) failed" }
          }
          $Expected = @{ 'out-mp4/clip.mp4' = 'h264,aac'; 'out-webm/clip.webm' = 'vp9,opus'; 'out-mp3/tone.mp3' = 'mp3'; 'out-ogg/tone.ogg' = 'vorbis' }
          foreach ($Name in $Expected.Keys) {
            $Codecs = (& "$Dir/ffprobe.exe" -v error -show_entries stream=codec_name -of csv=p=0 "$Work/$Name") -join ','
            "$Name $((Get-Item "$Work/$Name").Length) bytes: $Codecs"
            if ($Codecs -ne $Expected[$Name]) { throw "$Name has codecs '$Codecs', expected '$($Expected[$Name])'" }
          }
      - name: Archive the Windows corresponding source
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python packaging/windows/source-archive.py packaging/cache/windows/ffmpeg-build packaging/cache/windows $env:RELEASE_VERSION packaging/out/windows/release
          if ($LASTEXITCODE -ne 0) { throw 'Windows source archive failed' }
          Copy-Item packaging/out/windows/*.msi packaging/out/windows/release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-review
          path: packaging/out/windows/release/*
          if-no-files-found: error
