name: Build release linux
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_date_epoch:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
      history_url:
        default: ""
        type: string
      initial_release:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Synced release version (must match this commit)
        required: true
        type: string
      source_date_epoch:
        description: Release UTC Unix timestamp
        required: true
        type: string
      history_url:
        description: Previous signed update manifest HTTPS URL (required after first release)
        required: false
        type: string
      initial_release:
        description: Explicitly confirm this is the first public release
        default: false
        type: boolean
      dry_run:
        description: Build verification artifacts without signing or uploading
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-linux-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true
jobs:
  linux:
    # GitHub-hosted: Tenki's cargo config redirects crates.io to a proxy
    # registry that the offline build container cannot resolve.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      CONVT_LICENSE_PUBKEY: ${{ vars.CONVT_LICENSE_PUBKEY }}
      CONVT_UPDATE_PUBKEY: ${{ vars.CONVT_UPDATE_PUBKEY }}
      CONVT_LICENSE_STORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check requested version and trusted branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = false ]; then test "$GITHUB_REF" = refs/heads/main; fi
          if [ "$DRY_RUN" = false ]; then
            test "$CONVT_LICENSE_PUBKEY" = FifI4kZfp25-La18pwNa4CJ751s4hDP68D60bp9rQoY
          fi
          test "$(python3 scripts/release/sync-version.py --check)" = "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Populate locked Rust source cache
        run: cargo fetch --locked
      - name: Restore pinned bundle inputs
        uses: actions/cache@v4
        with:
          path: packaging/.cache
          key: linux-bundle-${{ hashFiles('packaging/linux/*.lock.json', 'packaging/linux/build-image.json', 'packaging/release/*.lock.json', 'packaging/release/appimage-source-build.sh') }}
      # Cargo target for the offline builder. Must stay outside the checkout
      # so source.py snapshot / the source tarball cannot pick it up.
      - name: Restore container Cargo target
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/convt-linux-compile/target
          key: linux-compile-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'packaging/linux/container-build.sh') }}
          restore-keys: |
            linux-compile-
      # Authenticate history with the production key before a dry run swaps in its temporary key.
      - name: Authenticate retained release history
        env:
          HISTORY_URL: ${{ inputs.history_url }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$HISTORY_URL" ]; then
            case "$HISTORY_URL" in https://*) ;; *) exit 2 ;; esac
            curl --location --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --max-time 30 "$HISTORY_URL" -o "$RUNNER_TEMP/history-signed.json"
            bun run release:manifest unpack-history "$RUNNER_TEMP/history-signed.json" "$RUNNER_TEMP/history.json"
            echo "CONVT_RELEASE_HISTORY=$RUNNER_TEMP/history.json" >> "$GITHUB_ENV"
          elif [ "$DRY_RUN" = false ] && [ "$INITIAL_RELEASE" != true ]; then
            echo 'Production requires signed history or explicit first-release confirmation' >&2
            exit 2
          fi
      - name: Prepare external update seed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.CONVT_UPDATE_SIGNING_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          key=$(mktemp)
          chmod 600 "$key"
          if [ "$DRY_RUN" = true ]; then
            rm "$key"
            bun run update:keygen "$key"
            echo "CONVT_UPDATE_PUBKEY=$(bun run release:manifest public-key "$key")" >> "$GITHUB_ENV"
          else
            test -n "$UPDATE_SIGNING_KEY"
            printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          fi
          echo "CONVT_UPDATE_SIGNING_KEY=$key" >> "$GITHUB_ENV"
      - name: Build unsigned Linux artifacts
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONVT_RELEASE_BUILD_WORK: ${{ runner.temp }}/convt-linux-compile
        run: |
          mode=--dry-run
          if [ "$DRY_RUN" = true ]; then mode=--verification-only; fi
          frozen=$(mktemp -d)
          rmdir "$frozen"
          python3 scripts/release/source.py snapshot "$frozen"
          export CONVT_RELEASE_SOURCE_TREE="$frozen"
          mkdir -p "$CONVT_RELEASE_BUILD_WORK"
          bun run release:linux "$mode" packaging/out/ci-a
          rm -rf "$frozen"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-review
          path: packaging/out/ci-a/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 7
      - name: Remove update seed
        if: always()
        run: |
          if [ -n "${CONVT_UPDATE_SIGNING_KEY:-}" ]; then rm -f "$CONVT_UPDATE_SIGNING_KEY"; fi
